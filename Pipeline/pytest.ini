[pytest]
# ── Discovery ───────────────────────────────────────────────────────────────
testpaths   = Tests
python_files  = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output ──────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers

# ── Markers (declare custom marks here to avoid PytestUnknownMarkWarning) ───
markers =
    slow: marks tests as slow (skip with -m "not slow")
    integration: end-to-end tests that need the full dataset
